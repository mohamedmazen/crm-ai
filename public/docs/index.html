<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Guides · AYDRA</title>
<meta name="description" content="AYDRA user documentation — choose your language. أدلة استخدام منصة AYDRA — اختر لغتك.">
<link rel="stylesheet" href="assets/docs.css?v=4">
<style>
    .lang-hero { max-width: 720px; margin: 0 auto; padding: 72px 22px 24px; text-align: center; }
    .lang-hero .eyebrow { margin-bottom: 18px; }
    .lang-hero h1 { font-size: 38px; margin: 0 0 10px; font-weight: 800; }
    .lang-hero p { color: var(--text-soft); font-size: 16.5px; margin: 0 auto 30px; max-width: 560px; }
    .lang-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 620px; margin: 0 auto 80px; padding: 0 22px; }
    .lang-card {
        display: block; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 30px 22px; box-shadow: var(--shadow);
        text-align: center; transition: transform .14s, border-color .14s;
    }
    .lang-card:hover { text-decoration: none; transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
    .lang-card .flag { font-size: 34px; line-height: 1; }
    .lang-card .name { display: block; margin-top: 12px; font-size: 20px; font-weight: 800; color: var(--text); }
    .lang-card .sub { display: block; margin-top: 4px; font-size: 13px; color: var(--text-muted); }
    @media (max-width: 560px) { .lang-cards { grid-template-columns: 1fr; } .lang-hero h1 { font-size: 28px; } }
</style>
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> AYDRA <small>User Guides · أدلة المستخدم</small></a>
</header>

<section class="lang-hero">
    <span class="eyebrow">Help Center · مركز المساعدة</span>
    <h1>AYDRA User Guides</h1>
    <p>Choose a language to open the manuals. اختر اللغة لفتح الأدلة.</p>
</section>

<main class="lang-cards">
    <a class="lang-card" href="ar/index.html" lang="ar" dir="rtl">
        <span class="flag">🇸🇦</span>
        <span class="name">العربية</span>
        <span class="sub">12 دليلًا عمليًا · الشرح الكامل بالنصوص والصور</span>
    </a>
    <a class="lang-card" href="en/index.html" lang="en">
        <span class="flag">🇬🇧</span>
        <span class="name">English</span>
        <span class="sub">12 practical guides · full detail with screenshots</span>
    </a>
</main>

<footer class="doc-footer" style="justify-content:center; padding-bottom:40px;">
    <span>AYDRA · User Guides · v1.0</span>
</footer>

<script>
    /* Remember the reader's choice and, on a first visit, follow the browser language. */
    (function () {
        var stored = null;
        try { stored = localStorage.getItem('aydra-docs-lang'); } catch (e) {}
        var lang = stored || ((navigator.language || 'ar').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
        document.querySelectorAll('.lang-card').forEach(function (card) {
            card.addEventListener('click', function () {
                try { localStorage.setItem('aydra-docs-lang', card.getAttribute('lang')); } catch (e) {}
            });
        });
        void lang; /* auto-redirect intentionally disabled so both options stay visible */
    })();
</script>
</body>
</html>
